# Déploiement du site NG Couvreur sur son domaine.
#
# Les visuels sont téléchargés depuis leur source et optimisés en AVIF/WebP/
# JPEG à plusieurs résolutions à chaque déploiement : ni les originaux ni les
# dérivés n'alourdissent le dépôt. Seul le dossier site/ est publié.
name: Déploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NG_PREVIEW: '0'
  NG_SITE_ORIGIN: 'https://ngcouvreur.fr'
  NG_BASE: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer la chaîne d'images
        run: python -m pip install --quiet --upgrade pip Pillow pillow-avif-plugin

      - name: Optimiser les visuels
        run: python3 build/optimize-images.py

      - name: Générer les pages
        run: python3 build/build.py

      - name: Vérifier que toute image référencée existe
        run: python3 build/verify-images.py

      - name: Contrôler le résultat
        run: |
          set -e
          test -f site/index.html
          test -f site/CNAME
          echo "Domaine publié : $(cat site/CNAME)"
          n=$(ls site/assets/img/*.avif 2>/dev/null | wc -l)
          echo "Variantes AVIF : $n"
          test "$n" -gt 0
          if grep -rl "cloudfront.net" site --include='*.html' | grep -q .; then
            echo "Des images pointent encore vers le CDN d'origine." >&2
            exit 1
          fi
          echo "Poids des images publiées :"
          du -sh site/assets/img

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
